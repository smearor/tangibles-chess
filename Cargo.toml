[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/tangibles-chess"
homepage = "https://github.com/smearor/tangibles-chess"

[workspace.dependencies]
# workspace crates
tangibles-chess-config = { path = "crates/config" }
tangibles-chess-session = { path = "crates/session" }
tangibles-chess-engine = { path = "crates/engine" }
tangibles-chess-geometry = { path = "crates/geometry" }
tangibles-chess-icons = { path = "crates/icons" }
tangibles-chess-material = { path = "crates/material" }
tangibles-chess-mcp = { path = "crates/mcp" }
tangibles-chess-moves = { path = "crates/moves" }
tangibles-chess-notation = { path = "crates/notation" }
tangibles-chess-tangibles = { path = "crates/tangibles" }
tangibles-chess-undo = { path = "crates/undo" }
# core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2.0"
miette = "7.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
# chess
shakmaty = "0.30"
pgn-reader = "0.27"
# gtk
gtk4 = { version = "0.11", features = ["v4_20"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
gio = "0.22"
glib = "0.22"
cairo-rs = "0.22"
gdk4 = "0.11"
smearor-wrot-rotation = "0.2"
# icons & fonts (git deps until 0.6 is published)
fonts-rs-generator = { git = "https://github.com/smearor/fonts-rs.git" }
fonts-rs-model = { git = "https://github.com/smearor/fonts-rs.git" }
fonts-rs-lucide = { git = "https://github.com/smearor/fonts-rs.git" }
fonts-rs-tabler = { git = "https://github.com/smearor/fonts-rs.git" }
fonts-rs-cuernavaca = { git = "https://github.com/smearor/fonts-rs.git" }
phf = "0.14"
# i18n
fluent = "0.17"
fluent-langneg = "0.14"
unic-langid = "0.9"
# tangible-objects daemon (typed GraphQL client, upstream)
tangible-objects-client = { git = "https://github.com/smearor/tangible-objects-rs.git" }
tangible-objects-model = { git = "https://github.com/smearor/tangible-objects-rs.git" }
# async / network
tokio = { version = "1", features = ["full"] }
futures-lite = "2"
async-channel = "2"
# MCP server (game-domain introspection/control)
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
# misc
url = "2"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
